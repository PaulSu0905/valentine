<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>給綺晴小朋友的驚喜 ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #e0f2fe;
            color: #334155;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            padding: 20px;
            overflow: hidden;
        }

        .card {
            background: #ffffff;
            padding: 2rem 1.5rem;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(186, 230, 253, 0.6);
            text-align: center;
            width: 100%;
            max-width: 400px;
            position: relative;
            max-height: 90dvh;
            overflow-y: auto;
        }

        h1, h2 {
            color: #0284c7;
            margin-bottom: 1rem;
            font-weight: 700;
            font-size: 1.4rem;
        }

        p {
            margin-bottom: 1rem;
            line-height: 1.5;
            font-size: 1rem;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        /* 統一按鈕區域排版 */
        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin-top: 1.5rem;
            min-height: 48px;
            width: 100%;
        }

        button {
            background-color: #38bdf8;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 20px;
            cursor: pointer;
            transition: transform 0.15s ease, background-color 0.2s ease;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
            touch-action: manipulation;
            min-width: 110px;
            height: 48px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
        }

        button:active {
            transform: scale(0.96);
        }

        .btn-evade {
            background-color: #94a3b8;
            box-shadow: 0 4px 12px rgba(148, 163, 184, 0.2);
            z-index: 999;
            transition: top 0.1s ease, left 0.1s ease;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #bae6fd;
            border-radius: 12px;
            margin-top: 8px;
            outline: none;
            font-size: 0.95rem;
            -webkit-appearance: none;
        }

        input[type="text"]:focus {
            border-color: #38bdf8;
        }

        .note {
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 6px;
        }

        .food-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
            margin-bottom: 10px;
            max-height: 240px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .food-options label {
            background: #f0f9ff;
            padding: 12px 14px;
            border-radius: 12px;
            cursor: pointer;
            border: 1px solid #bae6fd;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
        }

        .food-options input[type="radio"] {
            accent-color: #0284c7;
            width: 18px;
            height: 18px;
        }
    </style>
</head>
<body>

    <div class="card">
        <form id="valentineForm" action="https://formspree.io/f/xljraorq" method="POST">
            
            <!-- 第一頁 -->
            <div id="page1" class="page active">
                <h1>綺晴小朋友 💕</h1>
                <p>請問妳願意接受這個遲到的情人節小驚喜嗎(我這裡還沒遲到)？</p>
                <div class="btn-group">
                    <button type="button" onclick="nextPage(2)">接受 💖</button>
                    <button type="button" id="noBtn1" class="btn-evade">不接受 😜</button>
                </div>
            </div>

            <!-- 第二頁 -->
            <div id="page2" class="page">
                <h2>請問妳明天晚餐想要吃什麼呢？</h2>
                <div class="btn-group" style="flex-direction: column; gap: 12px;">
                    <button type="button" style="width: 100%;" onclick="selectType('healthy')">🥗 健康</button>
                    <button type="button" style="width: 100%;" onclick="selectType('unhealthy')">🍔 不健康</button>
                </div>
            </div>

            <!-- 第三頁：選菜單 + 按下直接送出 -->
            <div id="page3" class="page">
                <h2>為綺晴小朋友準備的選單 🍽️</h2>
                
                <p style="font-size: 0.85rem; color: #0284c7; margin-bottom: 8px;">路線：<span id="routeText"></span></p>
                <input type="hidden" name="飲食路線" id="hiddenRoute">

                <div class="food-options" id="foodContainer"></div>
                
                <div style="margin-top: 10px; text-align: left;">
                    <label style="font-size: 0.9rem; font-weight: 600;">都不想吃？自己點餐：</label>
                    <input type="text" name="自訂想吃的餐點" placeholder="請輸入妳想吃的餐點">
                    <div class="note">（註明：不能寫我喔 🙈）</div>
                </div>

                <div class="btn-group">
                    <button type="button" id="submitFoodBtn" style="width: 100%;" onclick="submitAndNext()">選好了，下一步 ✨</button>
                </div>
            </div>

            <!-- 第四頁：問下一個情人節 -->
            <div id="page4" class="page">
                <h2>綺晴小朋友 ❤️</h2>
                <p>下一個情人節也要跟我一起過嗎？</p>

                <div class="btn-group">
                    <button type="button" onclick="nextPage(5)">要！💖</button>
                    <button type="button" id="noBtn2" class="btn-evade">不要 🙈</button>
                </div>
            </div>

            <!-- 第五頁：最終溫馨結束畫面 -->
            <div id="page5" class="page">
                <h2>需求都收到囉！🥰</h2>
                <p><strong>綺晴小朋友，情人節快樂！</strong></p>
                <p style="font-size: 0.95rem; color: #0284c7; margin-top: 15px; line-height: 1.6;">
                    記得現在傳一張妳最可愛的照片給我喔！📸
                </p>
            </div>

        </form>
    </div>

    <script>
        function nextPage(pageNumber) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page' + pageNumber).classList.add('active');
        }

        function selectType(type) {
            const container = document.getElementById('foodContainer');
            const routeText = document.getElementById('routeText');
            const hiddenRoute = document.getElementById('hiddenRoute');
            container.innerHTML = '';

            let options = [];
            if (type === 'healthy') {
                routeText.innerText = '健康 🥗';
                hiddenRoute.value = '健康';
                options = ['健康餐 🥗', '丼飯 🍱', '沙拉 🥑', 'Poké 🥗', '海鮮 🐟', '火鍋 🍲'];
            } else {
                routeText.innerText = '不健康 🍔';
                hiddenRoute.value = '不健康';
                options = ['漢堡 🍔', '火鍋 🍲', '炸雞 🍗', '披薩 🍕', '燒肉 🥩'];
            }

            options.forEach((item, index) => {
                container.innerHTML += `
                    <label>
                        <input type="radio" name="預設菜單選擇" value="${item}" ${index === 0 ? 'checked' : ''}> ${item}
                    </label>
                `;
            });

            nextPage(3);
        }

        // 第三頁點「下一步」時：默默背景傳送 Formspree + 自動進入第四頁
        async function submitAndNext() {
            const btn = document.getElementById('submitFoodBtn');
            btn.innerText = '傳送中...';
            btn.disabled = true;

            const form = document.getElementById('valentineForm');
            const data = new FormData(form);

            try {
                // 背景靜靜發送
                fetch(form.action, {
                    method: 'POST',
                    body: data,
                    headers: { 'Accept': 'application/json' }
                });
            } catch (error) {
                console.log(error);
            }

            // 無論網路快慢，直接跳下一頁問情人節
            nextPage(4);
        }

        // 亂跳按鈕邏輯
        function makeBtnEvade(btnId) {
            const btn = document.getElementById(btnId);

            const moveButton = (e) => {
                if (e) e.preventDefault();

                btn.style.position = 'fixed';

                const rect = btn.getBoundingClientRect();
                const padding = 20;

                const maxX = window.innerWidth - rect.width - padding;
                const maxY = window.innerHeight - rect.height - padding;

                const newX = Math.max(padding, Math.random() * maxX);
                const newY = Math.max(padding, Math.random() * maxY);

                btn.style.left = `${newX}px`;
                btn.style.top = `${newY}px`;
            };

            btn.addEventListener('mouseover', moveButton);
            btn.addEventListener('touchstart', moveButton, { passive: false });
            btn.addEventListener('click', moveButton);
        }

        makeBtnEvade('noBtn1');
        makeBtnEvade('noBtn2');
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>給綺晴小朋友的七夕驚喜 ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #e0f2fe;
            color: #334155;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            padding: 20px;
            overflow: hidden;
        }

        .card {
            background: #ffffff;
            padding: 2rem 1.5rem;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(186, 230, 253, 0.6);
            text-align: center;
            width: 100%;
            max-width: 400px;
            position: relative;
            max-height: 90dvh;
            overflow-y: auto;
        }

        h1, h2 {
            color: #0284c7;
            margin-bottom: 1rem;
            font-weight: 700;
            font-size: 1.35rem;
        }

        p {
            margin-bottom: 1rem;
            line-height: 1.6;
            font-size: 0.98rem;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin-top: 1.5rem;
            min-height: 48px;
            width: 100%;
        }

        button {
            background-color: #38bdf8;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 20px;
            cursor: pointer;
            transition: transform 0.15s ease, background-color 0.2s ease;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
            touch-action: manipulation;
            min-width: 110px;
            height: 48px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
        }

        button:active {
            transform: scale(0.96);
        }

        .btn-evade {
            background-color: #94a3b8;
            box-shadow: 0 4px 12px rgba(148, 163, 184, 0.2);
            z-index: 999;
            transition: top 0.1s ease, left 0.1s ease;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #bae6fd;
            border-radius: 12px;
            margin-top: 8px;
            outline: none;
            font-size: 0.95rem;
            -webkit-appearance: none;
        }

        input[type="text"]:focus {
            border-color: #38bdf8;
        }

        .note {
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 6px;
        }

        .food-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
            margin-bottom: 10px;
            max-height: 200px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .food-options label {
            background: #f0f9ff;
            padding: 12px 14px;
            border-radius: 12px;
            cursor: pointer;
            border: 1px solid #bae6fd;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
        }

        .food-options input[type="radio"] {
            accent-color: #0284c7;
            width: 18px;
            height: 18px;
        }

        /* 機票樣式卡片 */
        .ticket-box {
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            border: 2px dashed #0284c7;
            border-radius: 16px;
            padding: 20px 15px;
            margin: 15px 0;
            position: relative;
            box-shadow: 0 4px 10px rgba(2, 132, 199, 0.1);
        }

        .ticket-header {
            font-size: 0.85rem;
            color: #0284c7;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .ticket-title {
            font-size: 1.1rem;
            color: #0369a1;
            font-weight: 700;
            margin: 10px 0;
        }

        .ticket-route {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #334155;
        }

        /* 倒數計時器容器 */
        .countdown-container {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin: 20px 0;
        }

        .time-box {
            background: #f0f9ff;
            border: 1px solid #bae6fd;
            border-radius: 12px;
            padding: 10px 4px;
            flex: 1;
        }

        .time-box .num {
            font-size: 1.4rem;
            font-weight: 700;
            color: #0284c7;
        }

        .time-box .label {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <div class="card">
        <form id="valentineForm" action="https://formspree.io/f/xljraorq" method="POST">
            <input type="hidden" name="獲得獎項" value="下學期一次飛香港找你兌換卷">

            <!-- 第一頁：七夕宣告 -->
            <div id="page1" class="page active">
                <h1>綺晴小朋友 💕</h1>
                <p style="text-align: left; background: #f0f9ff; padding: 16px; border-radius: 16px; border: 1px solid #bae6fd; font-weight: 500;">
                    今天是我們一起過的第一個七夕情人節，未來還會有無限多個，妳要期待喔！
                </p>
                <div class="btn-group">
                    <button type="button" onclick="nextPage(2)">很期待 </button>
                    <button type="button" id="noBtn1" class="btn-evade">還好... </button>
                </div>
            </div>

            <!-- 第二頁：選擇晚餐 -->
            <div id="page2" class="page">
                <h2>請問妳明天晚餐想要吃什麼呢？ 🍽️</h2>
                <div id="routeStep">
                    <p style="font-size: 0.9rem; color: #64748b;">請先選擇你想吃什麼：</p>
                    <div class="btn-group" style="flex-direction: column; gap: 12px; margin-top: 10px;">
                        <button type="button" style="width: 100%;" onclick="selectType('healthy')">🥗 健康</button>
                        <button type="button" style="width: 100%;" onclick="selectType('unhealthy')">🍔 不健康</button>
                    </div>
                </div>

                <div id="menuStep" style="display: none;">
                    <p style="font-size: 0.85rem; color: #0284c7; margin-bottom: 8px;">路線：<span id="routeText"></span></p>
                    <input type="hidden" name="飲食路線" id="hiddenRoute">

                    <div class="food-options" id="foodContainer"></div>
                    
                    <div style="margin-top: 10px; text-align: left;">
                        <label style="font-size: 0.85rem; font-weight: 600;">都不想吃？自己點餐：</label>
                        <input type="text" name="自訂想吃的餐點" placeholder="請輸入妳想吃的餐點">
                        <div class="note">（註明：不能寫我喔 🙈）</div>
                    </div>

                    <div class="btn-group">
                        <button type="button" style="width: 100%;" onclick="nextPage(3)">選好了，抽禮物 🎁</button>
                    </div>
                </div>
            </div>

            <!-- 第三頁：機票抽獎（必然抽到機票） -->
            <div id="page3" class="page">
                <h2>七夕專屬驚喜抽獎 🎁</h2>
                <p>點擊下方按鈕，抽取屬於妳的情人節大禮！</p>
                
                <div class="ticket-box" id="ticketBox" style="display: none;">
                    <div class="ticket-header">✈️ BOARDING PASS / 專屬機票</div>
                    <div class="ticket-title">下學期一次飛香港找你兌換券 🎟️</div>
                    <div class="ticket-route">
                        <span>USA</span>
                        <span>✈️</span>
                        <span>HONG KONG </span>
                    </div>
                </div>

                <div class="btn-group">
                    <button type="button" id="drawBtn" style="width: 100%;" onclick="drawTicket()">🎰 點我抽禮物！</button>
                    <button type="button" id="nextAfterDrawBtn" style="width: 100%; display: none;" onclick="submitAndNext()">領取機票，看見面倒數 ✈️</button>
                </div>
            </div>

            <!-- 第四頁：倒數計時器與見面提示 -->
            <div id="page4" class="page">
                <h2>我已經好期待跟你一起聖誕節和跨年 ✈️</h2>
                <p style="font-size: 0.95rem; color: #0284c7; font-weight: 600; margin-bottom: 5px;">距離 12/1７放假飛去香港還有：</p>
                
                <div class="countdown-container">
                    <div class="time-box">
                        <div class="num" id="days">00</div>
                        <div class="label">天</div>
                    </div>
                    <div class="time-box">
                        <div class="num" id="hours">00</div>
                        <div class="label">時</div>
                    </div>
                    <div class="time-box">
                        <div class="num" id="minutes">00</div>
                        <div class="label">分</div>
                    </div>
                    <div class="time-box">
                        <div class="num" id="seconds">00</div>
                        <div class="label">秒</div>
                    </div>
                </div>

                <p style="font-size: 0.95rem; color: #334155; margin-top: 15px; line-height: 1.6;">
                    <strong>綺晴小朋友，七夕情人節快樂！❤️</strong><br>
                    請傳一張妳可愛的照片給我喔！（單純因為我想看）
                </p>
            </div>

        </form>
    </div>

    <script>
        function nextPage(pageNumber) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page' + pageNumber).classList.add('active');
        }

        // 選擇晚餐路線與顯示選項
        function selectType(type) {
            document.getElementById('routeStep').style.display = 'none';
            document.getElementById('menuStep').style.display = 'block';

            const container = document.getElementById('foodContainer');
            const routeText = document.getElementById('routeText');
            const hiddenRoute = document.getElementById('hiddenRoute');
            container.innerHTML = '';

            let options = [];
            if (type === 'healthy') {
                routeText.innerText = '健康 🥗';
                hiddenRoute.value = '健康';
                options = ['健康餐 🥗', '丼飯 🍱', '沙拉 🥑', 'Poké 🥗', '海鮮 🐟', '火鍋 🍲'];
            } else {
                routeText.innerText = '不健康 🍔';
                hiddenRoute.value = '不健康';
                options = ['漢堡 🍔', '火鍋 🍲', '炸雞 🍗', '披薩 🍕', '燒肉 🥩'];
            }

            options.forEach((item, index) => {
                container.innerHTML += `
                    <label>
                        <input type="radio" name="預設菜單選擇" value="${item}" ${index === 0 ? 'checked' : ''}> ${item}
                    </label>
                `;
            });
        }

        // 抽機票邏輯
        function drawTicket() {
            document.getElementById('ticketBox').style.display = 'block';
            document.getElementById('drawBtn').style.display = 'none';
            document.getElementById('nextAfterDrawBtn').style.display = 'inline-flex';
        }

        // 送出表單資料並進入第四頁倒數計時
        async function submitAndNext() {
            const form = document.getElementById('valentineForm');
            const data = new FormData(form);

            try {
                fetch(form.action, {
                    method: 'POST',
                    body: data,
                    headers: { 'Accept': 'application/json' }
                });
            } catch (error) {
                console.log(error);
            }

            nextPage(4);
            startCountdown();
        }

        // 倒數計時器邏輯（目標時間：2026/12/18 00:00:00）
        function startCountdown() {
            const targetDate = new Date("2026-12-18T00:00:00").getTime();

            function updateTimer() {
                const now = new Date().getTime();
                const difference = targetDate - now;

                if (difference > 0) {
                    const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                    const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((difference % (1000 * 60)) / 1000);

                    document.getElementById("days").innerText = days < 10 ? '0' + days : days;
                    document.getElementById("hours").innerText = hours < 10 ? '0' + hours : hours;
                    document.getElementById("minutes").innerText = minutes < 10 ? '0' + minutes : minutes;
                    document.getElementById("seconds").innerText = seconds < 10 ? '0' + seconds : seconds;
                } else {
                    document.getElementById("days").innerText = "00";
                    document.getElementById("hours").innerText = "00";
                    document.getElementById("minutes").innerText = "00";
                    document.getElementById("seconds").innerText = "00";
                }
            }

            updateTimer();
            setInterval(updateTimer, 1000);
        }

        // 避開按鈕邏輯
        function makeBtnEvade(btnId) {
            const btn = document.getElementById(btnId);

            const moveButton = (e) => {
                if (e) e.preventDefault();

                btn.style.position = 'fixed';

                const rect = btn.getBoundingClientRect();
                const padding = 20;

                const maxX = window.innerWidth - rect.width - padding;
                const maxY = window.innerHeight - rect.height - padding;

                const newX = Math.max(padding, Math.random() * maxX);
                const newY = Math.max(padding, Math.random() * maxY);

                btn.style.left = `${newX}px`;
                btn.style.top = `${newY}px`;
            };

            btn.addEventListener('mouseover', moveButton);
            btn.addEventListener('touchstart', moveButton, { passive: false });
            btn.addEventListener('click', moveButton);
        }

        makeBtnEvade('noBtn1');
    </script>
</body>
</html>
